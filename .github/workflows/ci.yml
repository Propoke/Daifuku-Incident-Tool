name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: cmms
          POSTGRES_USER: cmms
          POSTGRES_PASSWORD: cmms
        ports:
          - 5432:5432
        # wait until Postgres is accepting connections before the job runs
        options: >-
          --health-cmd "pg_isready -U cmms"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SECRET_KEY: ci-secret-key-not-a-real-one
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      POSTGRES_DB: cmms
      POSTGRES_USER: cmms
      POSTGRES_PASSWORD: cmms
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Check for missing migrations
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run

      - name: Collect static files
        working-directory: backend
        # also validates the WhiteNoise/collectstatic pipeline the
        # deployment relies on, not just the tests
        run: python manage.py collectstatic --noinput

      - name: Run tests
        working-directory: backend
        run: python manage.py test --verbosity 2
