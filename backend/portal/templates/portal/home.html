<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Customer Portal</title>
  <style>
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.8rem; text-align: left; }
  </style>
</head>
<body>
  <h1>{{ contact.customer.name }} Portal</h1>
  <p>Logged in as {{ contact.user.get_username }} | <a href="{% url 'portal-logout' %}">Log out</a></p>
  <p>
    <a href="{% url 'portal-report-issue' %}">Report a new issue</a> |
    <a href="{% url 'portal-tickets' %}">All my tickets</a>
  </p>

  <h2>Recent tickets</h2>
  <table>
    <tr><th>Title</th><th>Asset</th><th>Status</th><th>Reported</th></tr>
    {% for t in tickets %}
    <tr>
      <td><a href="{% url 'portal-ticket-detail' t.pk %}">{{ t.title }}</a></td>
      <td>{{ t.asset.tag }}</td>
      <td>{{ t.status }}</td>
      <td>{{ t.created_at }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="4">No tickets yet.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
