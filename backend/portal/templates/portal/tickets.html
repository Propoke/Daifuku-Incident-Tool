<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>My tickets — Customer Portal</title>
  <style>
    table { border-collapse: collapse; }
    th, td { border: 1px solid #ccc; padding: 0.4rem 0.8rem; text-align: left; }
  </style>
</head>
<body>
  <h1>My tickets</h1>
  <p><a href="{% url 'portal-home' %}">Home</a> | <a href="{% url 'portal-report-issue' %}">Report a new issue</a></p>
  <table>
    <tr><th>Title</th><th>Asset</th><th>Status</th><th>Priority</th><th>Reported</th></tr>
    {% for t in tickets %}
    <tr>
      <td><a href="{% url 'portal-ticket-detail' t.pk %}">{{ t.title }}</a></td>
      <td>{{ t.asset.tag }}</td>
      <td>{{ t.status }}</td>
      <td>{{ t.priority }}</td>
      <td>{{ t.created_at }}</td>
    </tr>
    {% empty %}
    <tr><td colspan="5">No tickets yet.</td></tr>
    {% endfor %}
  </table>
</body>
</html>
