services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --certificatesresolvers.cloudflare.acme.dnschallenge=true
      - --certificatesresolvers.cloudflare.acme.dnschallenge.provider=cloudflare
      - --certificatesresolvers.cloudflare.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.cloudflare.acme.storage=/etc/traefik/acme/acme.json
      - --certificatesresolvers.cloudflare.acme.caserver=${ACME_CA_SERVER:-https://acme-v02.api.letsencrypt.org/directory}
    ports:
      - "80:80"
      - "443:443"
    env_file: .env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/acme:/etc/traefik/acme
    restart: unless-stopped

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cmms}
      POSTGRES_USER: ${POSTGRES_USER:-cmms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      - postgres
      - redis
    volumes:
      # Uploaded attachments (core.Attachment) live on local disk inside
      # the container - without this volume they'd vanish on every
      # redeploy/recreate. Not mounted on the celery containers below;
      # nothing there touches media files.
      - media_data:/app/media
    labels:
      - traefik.enable=true
      - traefik.http.routers.cmms.rule=Host(`${CMMS_HOSTNAME}`)
      - traefik.http.routers.cmms.entrypoints=websecure
      - traefik.http.routers.cmms.tls.certresolver=cloudflare
      - traefik.http.services.cmms.loadbalancer.server.port=8000
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    restart: unless-stopped

  # Migrations only run in `backend`'s startup command. If these start
  # before that finishes on a fresh deploy, they'll crash and retry - fine
  # under `restart: unless-stopped`, but worth knowing before assuming
  # something's actually broken.
  celery-worker:
    build: ./backend
    command: celery -A cmms worker -l info
    env_file: .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  celery-beat:
    build: ./backend
    command: celery -A cmms beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    env_file: .env
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
